name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU-only PyTorch
        run: |
          pip install --upgrade pip
          pip install "torch>=2.0.0,<3.0.0" "torchvision>=0.15.0,<1.0.0" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          grep -v -E "^(torch|torchvision)" requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
          pip install ruff pytest httpx

      - name: Lint (ruff)
        run: ruff check src api tests inference.py app.py train_classifier.py

      - name: Run tests
        env:
          MPLBACKEND: Agg
          PYTHONPATH: .
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: docforg:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
