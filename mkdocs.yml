site_name: Document Forgery Detection
site_description: AI-powered system for detecting tampered documents — forged signatures, stamps, and copy-move manipulations.
site_author: Qurban Quliyev
site_url: https://your-username.github.io/document-forgery-detection

repo_name: document-forgery-detection
repo_url: https://github.com/your-username/document-forgery-detection
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-username/document-forgery-detection
  version:
    provider: mike

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - Data Pipeline:
    - data-pipeline/index.md
    - Download Datasets: data-pipeline/download.md
    - Generate Forgeries: data-pipeline/generate.md
    - Prepare Splits: data-pipeline/prepare.md
  - Training:
    - training/index.md
    - CNN Classifier: training/classifier.md
    - YOLO Detector: training/yolo.md
    - Experiment Tracking: training/mlflow.md
  - Services:
    - services/index.md
    - REST API: services/api.md
    - Demo App: services/demo.md
    - Log Monitoring: services/monitoring.md
  - Reference:
    - reference/architecture.md
    - Configuration Reference: reference/configuration.md
    - CLI Reference: reference/cli.md
    - Troubleshooting: reference/troubleshooting.md
